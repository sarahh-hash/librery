services:
  postgres:
    image: postgres:17
    container_name: library-postgres
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: ${DB_USER:-library}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - library-pgdata:/var/lib/postgresql/data

volumes:
  library-pgdata: